# Shared, non-secret defaults for every GhostBridge application.
# Lowest precedence: any application.yml / environment value overrides these.
# Never put credentials or tokens here.

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Never leak internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Jackson / time
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Persistence safety (no effect without JPA)
spring.jpa.open-in-view=false

# Payload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Secure cookies
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Actuator: expose only health and info; no details to anonymous callers
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
